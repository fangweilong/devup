[package]
name = "devup"
version = "0.3.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.1"
tokio = { version = "1.53.3", features = ["full"] }
wry = "0.57.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

# Windows PE 资源编译：将图标与版本信息写入 .rsrc 段（tao 的窗口图标不写入磁盘图标）
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"

# macOS 定向整窗拖拽需在拖拽中段合成 LeftMouseDown 事件（tao 的 drag_window 不做此补偿）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
