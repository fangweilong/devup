name: Build & Release

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'Cargo.toml'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      should_release: ${{ steps.vars.outputs.should }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version tag
        id: vars
        shell: bash
        run: |
          cargo_version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=${cargo_version}" >> "$GITHUB_OUTPUT"
          target_tag="v${cargo_version}"
          tag="$target_tag"
          should=false

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # tag 推送：直接以该 tag 发布
            tag="$GITHUB_REF_NAME"
            should=true
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # 手动触发：总是发布；tag 不存在则补打
            should=true
            if ! git tag -l "$target_tag" | grep -q .; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$target_tag"
              git push origin "$target_tag"
            fi
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            # main 分支推送：tag 尚不存在时自动打 tag 并发布
            if ! git tag -l "$target_tag" | grep -q .; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$target_tag"
              git push origin "$target_tag"
              should=true
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "should=$should" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --release --locked

      - name: Rename Executable
        run: Copy-Item target/release/devup.exe -Destination devup.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: devup-windows-x64
          path: devup.exe

  build-macos:
    needs: version
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            label: arm64
          - target: x86_64-apple-darwin
            label: x64
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --release --locked --target ${{ matrix.target }}

      # 产出 DevUp.app / DevUp_<ver>_<arch>.dmg（人用）/ DevUp_<ver>_<arch>.app.tar.gz（应用内自升级用）
      # 默认 ad-hoc 签名。日后拿到 Developer ID 证书后，把下面注释里的步骤补上，
      # 并用 --identity 传入签名身份（bundle.sh 已支持 hardened runtime + 公证钩子）。
      - name: Package .app / .dmg
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bash packaging/macos/bundle.sh \
            --binary "target/${{ matrix.target }}/release/devup" \
            --version "$VERSION" \
            --arch "${{ matrix.label }}" \
            --out dist
          codesign --verify --verbose=2 dist/DevUp.app
          ls -la dist

      # ---- 换正式签名时打开（需配置 secrets）------------------------------------
      # env 里加：APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}            # base64 的 .p12
      #          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      # - name: Import Developer ID certificate
      #   run: |
      #     echo "$APPLE_CERT_P12" | base64 -d > cert.p12
      #     create-keychain -p "" build.keychain
      #     default-keychain -s build.keychain
      #     unlock-keychain -p "" build.keychain
      #     security import cert.p12 -T /usr/bin/codesign -k build.keychain \
      #       -P "$APPLE_CERT_PASSWORD"
      #     codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" ...
      #   # bundle.sh 收到 --identity 后自动走 hardened runtime + entitlements.plist；
      #   # 再追加 --notarize 并在 CI 里配好 notarytool keychain profile 即可公证。
      # ---------------------------------------------------------------------------------

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: devup-macos-${{ matrix.label }}
          path: dist/*

  release:
    needs: [version, build-windows, build-macos]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: DevUp ${{ needs.version.outputs.tag_name }}
          files: |
            devup.exe
            DevUp_*.dmg
            DevUp_*.app.tar.gz
          generate_release_notes: true
